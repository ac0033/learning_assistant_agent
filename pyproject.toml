[project]
name = "learning-assistant-agent"
version = "0.1.0"
description = "AI Teaching Assistant Agent for open-source university courses (CS/AI/Math/Stats/DS)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Learning Assistant Agent Team" }
]
keywords = ["ai", "education", "rag", "langgraph", "chainlit", "teaching", "llm"]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.116.0",
    "chainlit>=2.11.1",
    "chromadb>=1.5.9",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.8",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.7",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-embeddings-voyageai>=0.6.1",
    "llama-index-llms-anthropic>=0.11.8",
    "llama-index-vector-stores-chroma>=0.5.5",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "voyageai>=0.4.1",
]
